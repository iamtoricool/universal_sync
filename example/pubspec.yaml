name: example
description: "Flutter offline-first todo demo using universal_sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  universal_sync:
    path: ../
  flutter_riverpod: ^2.6.1
  dio: ^5.4.0
  uuid: ^4.5.3
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
